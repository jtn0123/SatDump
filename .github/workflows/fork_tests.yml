name: Fork tests

# The fork's test gate (tests/gate.sh) on every push and pull request to pi: the Raspberry Pi
# preset build with its warning check, then the unit, command-line and golden tests; and the
# same tests in an AddressSanitizer/UBSan build with the Rust parts switched on (the Pi build
# leaves them off). It runs on arm64 in Debian 13, like the Pi.
on:
  push:
    branches: [pi]
  pull_request:
    branches: [pi]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04-arm
    # privileged so that cli_offline can run SatDump in a network namespace with no network
    # (unshare -rmn); SATDUMP_REQUIRE_NETNS=1 below makes a missing namespace a failure, not a skip
    container:
      image: debian:trixie
      options: --privileged
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pi preset
            flags: ""
          - name: sanitizers
            flags: -DSATDUMP_SANITIZERS=address,undefined -DSATDUMP_CPU_FLAGS= -DBUILD_GUI=OFF -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSATDUMP_WITH_RUST=ON
    env:
      SATDUMP_GUARD: "off"  # the pass and disk checks are for receiving stations
      SATDUMP_REQUIRE_NETNS: "1"
      CCACHE_MAXSIZE: 1500M
      CCACHE_COMPRESS: "true"
    steps:
      - name: Install build dependencies
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends \
            git ca-certificates build-essential cmake ninja-build ccache pkgconf python3 cargo rustc rust-clippy \
            libfftw3-dev libpng-dev libtiff-dev libjemalloc-dev libcurl4-openssl-dev libvolk-dev \
            libnng-dev libzstd-dev libhdf5-dev libsqlite3-dev libarmadillo-dev libbz2-dev libopenjp2-7-dev libaec-dev libomp-dev \
            libmuparser-dev \
            ocl-icd-opencl-dev libdbus-1-dev portaudio19-dev librtlsdr-dev libairspy-dev libairspyhf-dev \
            libglfw3-dev libgl-dev libx11-dev libxcursor-dev libxext-dev libxi-dev libxinerama-dev libxrandr-dev

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up ccache
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"

      - uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-${{ matrix.name }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.name }}-

      - name: Configure
        run: >
          cmake -C cmake/fork/pi.cmake -S . -B build -G Ninja -DSATDUMP_TESTS=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache ${{ matrix.flags }}

      - name: Build and test (tests/gate.sh)
        run: tests/gate.sh build

      - name: ccache statistics
        if: always()
        run: ccache --show-stats || true

      - name: Keep the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.name }}
          path: |
            build/gate-build.log
            build/gate-install.log
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
